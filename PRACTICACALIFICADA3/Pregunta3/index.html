<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pregunta 3</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="paisaje" aria-label="Paisaje nocturno animado">

    <!-- Cielo con luna y estrellas -->
    <div class="cielo">
      <div class="luna">
        <div class="crater crater-1"></div>
        <div class="crater crater-2"></div>
        <div class="crater crater-3"></div>
      </div>
      <div class="estrellas">
        <span class="estrella e1"></span>
        <span class="estrella e2"></span>
        <span class="estrella e3"></span>
        <span class="estrella e4"></span>
        <span class="estrella e5"></span>
        <span class="estrella e6"></span>
        <span class="estrella e7"></span>
        <span class="estrella e8"></span>
      </div>
      <div class="nubes">
        <div class="nube n1"></div>
        <div class="nube n2"></div>
        <div class="nube n3"></div>
      </div>
    </div>

    <!-- Murciélagos volando -->
    <div class="murcielagos">
      <div class="murcielago m1"></div>
      <div class="murcielago m2">🦇</div>
      <div class="murcielago m3">🦇</div>
    </div>

    <!-- Montañas en capas (parallax) -->
    <div class="montanas montana-lejana"></div>
    <div class="montanas montana-media"></div>
    <div class="montanas montana-cercana"></div>

    <!-- Árboles muertos -->
    <div class="arboles">
      <div class="arbol a1"></div>
      <div class="arbol a2"></div>
      <div class="arbol a3"></div>
      <div class="arbol a4"></div>
    </div>

    <!-- Ojos brillantes entre los árboles -->
    <div class="ojos">
      <div class="ojo-par o1"><span></span><span></span></div>
      <div class="ojo-par o2"><span></span><span></span></div>
    </div>

    <!-- Niebla en el suelo -->
    <div class="niebla">
      <div class="bruma b1"></div>
      <div class="bruma b2"></div>
    </div>

    <!-- Suelo -->
    <div class="suelo"></div>

  </section>

</body>
</html>
