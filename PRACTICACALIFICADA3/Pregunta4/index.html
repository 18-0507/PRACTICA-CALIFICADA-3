<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pregunta 4 — Panel con CSS Moderno y Compatibilidad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="panel-control" aria-label="Panel de control de la mansión embrujada">
    
    <h2 class="panel-control__titulo">👁️ Panel de Control</h2>

    <div class="panel-control__grid">
      
      <article class="panel-card panel-card--diamante">
        <span class="panel-card__icono">👻</span>
        <h3 class="panel-card__titulo">Almas Atrapadas</h3>
        <p class="panel-card__descripcion">Entidades espectrales detectadas en la mansión</p>
      </article>

      <article class="panel-card">
        <span class="panel-card__icono"></span>
        <h3 class="panel-card__titulo">Murciélagos</h3>
        <p class="panel-card__descripcion">Criaturas nocturnas en el perímetro</p>
      </article>

      <article class="panel-card">
        <span class="panel-card__icono">💀</span>
        <h3 class="panel-card__titulo">Maldiciones</h3>
        <p class="panel-card__descripcion">Hechizos activos en la propiedad</p>
      </article>

      <article class="panel-card panel-card--diamante">
        <span class="panel-card__icono">🕯️</span>
        <h3 class="panel-card__titulo">Velas Encendidas</h3>
        <p class="panel-card__descripcion">Fuentes de luz sobrenatural</p>
      </article>

    </div>

    <div class="panel-control__botones">
      <button class="btn-terror" type="button">Explorar</button>
      <button class="btn-terror btn-terror--secundario" type="button">Huir</button>
    </div>

    <div class="panel-stats">
      <div class="stat-item">
        <span class="stat-item__numero">13</span>
        <div class="stat-item__label">Habitaciones</div>
      </div>
      <div class="stat-item">
        <span class="stat-item__numero">666</span>
        <div class="stat-item__label">Años de Antigüedad</div>
      </div>
      <div class="stat-item">
        <span class="stat-item__numero">∞</span>
        <div class="stat-item__label">Nivel de Terror</div>
      </div>
    </div>

  </section>

</body>
</html>
